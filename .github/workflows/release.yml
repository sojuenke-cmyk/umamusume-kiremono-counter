# v で始まるタグ（例: v0.1.0）を push すると、リリースビルドを作成して GitHub Release に添付する。
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/UmaKiremonoCounter/UmaKiremonoCounter.csproj -p:PublishProfile=win-x64 -p:Version=$version

      - name: Package
        shell: pwsh
        run: |
          $zip = "UmaKiremonoCounter-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -Path src/UmaKiremonoCounter/bin/publish/win-x64/UmaKiremonoCounter.exe, README.md -DestinationPath $zip
          "ZIP=$zip" >> $env:GITHUB_ENV

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" $env:ZIP --title "${{ github.ref_name }}" --generate-notes
